name: Deploy na AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Atualizar aplicacao
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar acesso SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -eu
          test -n "$EC2_HOST"
          test -n "$EC2_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Fazer deploy na EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -eu
          test -n "$EC2_USER"
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" 'bash -se' <<'REMOTE'
            set -euo pipefail

            APP_DIR="$HOME/Streaming"
            REPOSITORY="https://github.com/pedro010306santo-byte/Streaming.git"

            if [ -d "$APP_DIR/.git" ]; then
              git -C "$APP_DIR" pull --ff-only origin main
            else
              git clone --branch main --single-branch "$REPOSITORY" "$APP_DIR"
            fi

            cd "$APP_DIR"
            test -f .env || {
              echo "Arquivo $APP_DIR/.env ausente. Siga a configuracao descrita no README." >&2
              exit 1
            }

            sudo docker compose -f docker-compose.prod.yml config --quiet
            sudo docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            sudo docker compose -f docker-compose.prod.yml ps
            curl --fail --silent --show-error --retry 12 --retry-delay 5 http://127.0.0.1/ >/dev/null
          REMOTE
