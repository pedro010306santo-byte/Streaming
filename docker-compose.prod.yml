services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: streaming-app:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    environment:
      APP_NAME: "Streaming Music"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:-http://localhost}"
      APP_LOCALE: pt_BR
      APP_FALLBACK_LOCALE: pt_BR
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: streaming
      DB_USERNAME: streaming
      DB_PASSWORD: "${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env da EC2}"
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: public
      RUN_SEEDER: "${RUN_SEEDER:-false}"
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: streaming
      MYSQL_USER: streaming
      MYSQL_PASSWORD: "${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env da EC2}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no arquivo .env da EC2}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  app_storage:
  mysql_data:
